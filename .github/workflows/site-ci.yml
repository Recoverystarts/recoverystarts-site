# Finished product for automation: no other steps needed.
# Site CI for recoverystarts.com, on every PR into main and every push to main.
#   site-check     builds dist/ with scripts/pages-dist.sh (the Pages build command), runs the Functions security tests,
#                  scripts/ci/site-check.js, and the quote gate scripts/audit-readings.js. The quote gate reads the A.A.
#                  source scans from the private repo Recoverystarts/recovery-einstein via the EINSTEIN_READ_TOKEN secret;
#                  without the secret that step is skipped with a warning.
#   preview-links  waits for Cloudflare Pages' check on the PR's commit, reads its preview URL, and runs
#                  scripts/ci/preview-links.js against it.
name: Site CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-check:
    name: site-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (scripts/pages-dist.sh, the Pages build command)
        run: sh scripts/pages-dist.sh
      - name: Functions security tests
        run: node --test tests/functions-security.test.mjs
      - name: File count, pages per language, internal links, translated → English
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in 0000000*|"") BASE=HEAD~1 ;; esac
          node scripts/ci/site-check.js --base "$BASE"
      - name: Quote sources (private recovery-einstein; needs EINSTEIN_READ_TOKEN)
        id: hist
        env:
          TOKEN: ${{ secrets.EINSTEIN_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::audit-readings.js skipped: no EINSTEIN_READ_TOKEN secret yet (the A.A. sources are in the private recovery-einstein repo)"
            echo "have=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git init -q "$RUNNER_TEMP/re" && cd "$RUNNER_TEMP/re"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/Recoverystarts/recovery-einstein.git"
          git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- historian-sources
          # the OCR repair map comes from the fix/ocr-corpus-repairs branch when main lacks it
          if [ ! -f historian-sources/ocr-repairs.json ]; then
            git fetch -q --depth 1 origin fix/ocr-corpus-repairs && git show FETCH_HEAD:historian-sources/ocr-repairs.json > historian-sources/ocr-repairs.json
          fi
          git remote remove origin
          echo "have=1" >> "$GITHUB_OUTPUT"
      - name: Quote gate (scripts/audit-readings.js)
        if: steps.hist.outputs.have == '1'
        env:
          HISTORIAN_SOURCES: ${{ runner.temp }}/re/historian-sources
        run: node scripts/audit-readings.js

  preview-links:
    name: preview-links
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare Pages' preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            j=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Cloudflare%20Pages" --jq '.check_runs[0] | {status, conclusion, summary: .output.summary}' 2>/dev/null || echo '{}')
            st=$(jq -r '.status // ""' <<<"$j"); co=$(jq -r '.conclusion // ""' <<<"$j")
            if [ "$st" = completed ]; then
              if [ "$co" != success ]; then echo "::error::Cloudflare Pages could not build this commit ($co): see its check on the PR"; exit 1; fi
              url=$(jq -r '.summary' <<<"$j" | grep -oE 'https://[a-z0-9]+\.recoverystarts-site\.pages\.dev' | head -1)
              [ -n "$url" ] || { echo "::error::no preview URL in Cloudflare Pages' check"; exit 1; }
              echo "url=$url" >> "$GITHUB_OUTPUT"; echo "preview: $url"; exit 0
            fi
            sleep 20
          done
          echo "::error::Cloudflare Pages did not finish a preview of $SHA in 20 minutes"; exit 1
      - name: Build dist/ (to know which translated pages exist)
        run: sh scripts/pages-dist.sh
      - name: Link check on the preview (scripts/ci/preview-links.js)
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: node scripts/ci/preview-links.js "$URL"

  # Finished product for automation: no other steps needed. A non-draft claude/* PR merges once site-check passes.
  merge:
    needs: [site-check]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge --delete-branch

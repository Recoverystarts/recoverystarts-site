    // Auto-redirect to today's reading. Falls back to the hub if that month
    // isn't published yet (only July / Tradition 7 is live today).
    // Stay in the reader's language: /es/…/today/ goes to /es/…, English to /…. A day a language hasn't published
    // yet falls back to the English one (404.html sends a missing /<lang>/ page to its English path).
    var L = (document.documentElement.lang || 'en').split('-')[0].toLowerCase();
    var P = L !== 'en' && location.pathname.indexOf('/' + L + '/') === 0 ? '/' + L : '';
    var MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    var LIVE = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    var now = new Date();
    var month = MONTHS[now.getMonth()];
    var day = now.getDate();
    if (LIVE.indexOf(month) !== -1) {
      window.location.replace(P + '/daily-tradition/' + month + '-' + day + '/');
    } else {
      window.location.replace(P + '/daily-tradition/');
    }

e unmanageable.":"私たちはアルコールに対し無力であり、人生が手に負えなくなっていたことを認めた。","Came to believe that a Power greater than ourselves could restore us to sanity.":"自分を超えた大きな力が、私たちを健康な心に戻してくれると信じるようになった。","Made a decision to turn our will and our lives over to the care of God as we understood Him.":"私たちの意志と生きかたを、自分なりに理解した神の配慮にゆだねる決心をした。","Made a searching and fearless moral inventory of ourselves.":"恐れずに、徹底して、自分自身の棚卸しを行い、それを表に作った。","Admitted to God, to ourselves, and to another human being the exact nature of our wrongs.":"神に対し、自分に対し、そしてもう一人の人に対して、自分の過ちの本質をありのままに認めた。","Were entirely ready to have God remove all these defects of character.":"こうした性格上の欠点全部を、神に取り除いてもらう準備がすべて整った。","Humbly asked Him to remove our shortcomings.":"私たちの短所を取り除いてくださいと、謙虚に神に求めた。","Made a list of all persons we had harmed, and became willing to make amends to them all.":"私たちが傷つけたすべての人の表を作り、その人たち全員に進んで埋め合わせをしようとする気持ちになった。","Made direct amends to such people wherever possible, except when to do so would injure them or others.":"その人たちやほかの人を傷つけない限り、機会あるたびに、その人たちに直接埋め合わせをした。","Continued to take personal inventory and when we were wrong promptly admitted it.":"自分自身の棚卸しを続け、間違ったときは直ちにそれを認めた。","Sought through prayer and meditation to improve our conscious contact with God as we understood Him, praying only for knowledge of His will for us and the power to carry that out.":"祈りと黙想を通して、自分なりに理解した神との意識的な触れ合いを深め、神の意志を知ることと、それを実践する力だけを求めた。","Having had a spiritual awakening as the result of these Steps, we tried to carry this message to alcoholics, and to practice these principles in all our affairs.":"これらのステップを経た結果、私たちは霊的に目覚め、このメッセージをアルコホーリクに伝え、そして私たちのすべてのことにこの原理を実行しようと努力した。","Personal Stories – Part I":"個人の物語 第1部","Personal Stories – Part II":"個人の物語 第2部","Personal Stories – Part III":"個人の物語 第3部","Personal Stories":"個人の物語","Foreword to First Edition":"初版に寄せて","Foreword to Second Edition":"再版にあたって","Foreword to Third Edition":"第三版に寄せて","Foreword to Fourth Edition":"第四版に寄せて","Preface":"前書き","Title Page":"扉","Copyright Page":"著作権のページ",

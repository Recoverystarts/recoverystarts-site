    // Auto-redirect to today's reading. Falls back to the hub if that month
    // isn't published yet (only July / Tradition 7 is live today).
    // Stay in the reader's language: /es/…/today/ goes to /es/…, English to /…. A day a language hasn't published
    // yet falls back to the English one (404.html sends a missing /<lang>/ page to its English path).
    var L = (document.documentElement.lang || 'en').split('-')[0].toLowerCase();
    var P = L !== 'en' && location.pathname.indexOf('/' + L + '/') === 0 ? '/' + L : '';
    var MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    var LIVE = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    var now = new Date();
    var month = MONTHS[now.getMonth()];
    var day = now.getDate();
    if (LIVE.indexOf(month) !== -1) {
      window.location.replace(P + '/daily-tradition/' + month + '-' + day + '/');
    } else {
      window.location.replace(P + '/daily-tradition/');
    }

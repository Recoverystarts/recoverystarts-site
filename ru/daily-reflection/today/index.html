s of character.":"Полностью подготовили себя к тому, чтобы Бог избавил нас от всех наших недостатков.","Humbly asked Him to remove our shortcomings.":"Смиренно просили Его исправить наши изъяны.","Made a list of all persons we had harmed, and became willing to make amends to them all.":"Составили список всех тех людей, кому мы причинили зло, и преисполнились желанием загладить свою вину перед ними.","Made direct amends to such people wherever possible, except when to do so would injure them or others.":"Лично возмещали причинённый этим людям ущерб, где только возможно, кроме тех случаев, когда это могло повредить им или кому-либо другому.","Continued to take personal inventory and when we were wrong promptly admitted it.":"Продолжали самоанализ и, когда допускали ошибки, сразу признавали это.","Sought through prayer and meditation to improve our conscious contact with God as we understood Him, praying only for knowledge of His will for us and the power to carry that out.":"Стремились путём молитвы и размышления углубить соприкосновение с Богом, как мы понимали Его, молясь лишь о знании Его воли, которую нам надлежит исполнить, и о даровании силы для этого.","Having had a spiritual awakening as the result of these Steps, we tried to carry this message to alcoholics, and to practice these principles in all our affairs.":"Достигнув духовного пробуждения, к которому привели эти шаги, мы старались донести смысл наших идей до других алкоголиков и применять эти принципы во всех наших делах.","Personal Stories – Part I":"Личные истории — часть I","Personal Stories – Part II":"Личные истории — часть II","Personal Stories – Part III":"Личные истории — часть III","Personal Stories":"Личные истории","Foreword to First Edition":"Предисловие к первому изданию","Foreword to Second Edition":"Предисловие ко второму изданию","Foreword to Third Edition":"Предисловие к третьему изданию","Foreword to Fourth Edition":"Предисловие к четвёртому изданию","Preface":"Введение","Title Page":"Т
